name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_GOOGLE_BOOKING_EMBED_URL: ${{ vars.NEXT_PUBLIC_GOOGLE_BOOKING_EMBED_URL }}
          NEXT_PUBLIC_GOOGLE_BOOKING_URL: ${{ vars.NEXT_PUBLIC_GOOGLE_BOOKING_URL }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
          NEXT_PUBLIC_INSTAGRAM_URL: ${{ vars.NEXT_PUBLIC_INSTAGRAM_URL }}
          NEXT_PUBLIC_BOOKING_FORM_ENDPOINT: ${{ vars.NEXT_PUBLIC_BOOKING_FORM_ENDPOINT }}
          NEXT_PUBLIC_BOOKING_ARTIST_EMAIL: ${{ vars.NEXT_PUBLIC_BOOKING_ARTIST_EMAIL }}
          NEXT_PUBLIC_VENMO_HANDLE: ${{ vars.NEXT_PUBLIC_VENMO_HANDLE }}
          NEXT_PUBLIC_CASHAPP_HANDLE: ${{ vars.NEXT_PUBLIC_CASHAPP_HANDLE }}
          NEXT_PUBLIC_APPLE_PAY_HANDLE: ${{ vars.NEXT_PUBLIC_APPLE_PAY_HANDLE }}
          NEXT_PUBLIC_VENMO_URL: ${{ vars.NEXT_PUBLIC_VENMO_URL }}
          NEXT_PUBLIC_CASHAPP_URL: ${{ vars.NEXT_PUBLIC_CASHAPP_URL }}

      # GitHub Pages runs Jekyll by default, which ignores `_next/`.
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
